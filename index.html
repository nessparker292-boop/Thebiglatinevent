<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b07">
<title>The Big Latin Event | Programma 2026</title>
<style>
:root{color-scheme:dark;--gold:#f0c86a;--cream:#fff2c6;--ink:#100b07}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 50% -10%,#4a2a0d,#100b07 42rem);color:var(--cream);font:16px/1.5 system-ui,sans-serif;text-align:center}
header{padding:clamp(2rem,8vw,4.5rem) 1rem 1.5rem}.eyebrow{margin:0;color:var(--gold);font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
h1{margin:.55rem 0 .35rem;color:var(--gold);font:italic 700 clamp(2.5rem,9vw,5.2rem)/1 Georgia,serif;text-shadow:0 0 24px #9b5d17}
header p{margin:.35rem 0}.muted{color:#d5c39d}
nav{position:sticky;top:0;z-index:2;display:flex;justify-content:center;gap:.55rem;padding:.75rem .65rem;background:#100b07eb;border-block:1px solid #6e4b1e;backdrop-filter:blur(10px)}
button{min-height:44px;border:1px solid #a27634;border-radius:999px;padding:.65rem 1rem;background:#24170d;color:var(--cream);font:inherit;font-weight:700;cursor:pointer}button:hover,button:focus-visible{border-color:var(--cream)}button[aria-selected=true]{background:var(--gold);color:var(--ink)}
main{max-width:980px;margin:auto;padding:1.25rem .75rem 2.5rem}h2{margin:.25rem 0;color:var(--gold);font:700 clamp(1.35rem,4vw,2rem) Georgia,serif}.hint{margin:.8rem 0 0;color:#d5c39d;font-size:.9rem}
.poster-frame{margin:1.25rem auto 0;max-width:720px;border:1px solid #a27634;border-radius:14px;padding:.4rem;background:#0b0805;box-shadow:0 16px 55px #0009,0 0 28px #8d4d1470}.poster-frame button{display:block;width:100%;padding:0;border:0;border-radius:10px;background:none;overflow:hidden}.poster-frame img{display:block;width:100%;height:auto;border-radius:10px}
footer{padding:1.5rem 1rem 3rem;border-top:1px solid #493018;color:#ead8ad}footer strong{color:var(--gold);letter-spacing:.1em}footer a{color:var(--cream)}
dialog{width:min(96vw,1100px);max-height:96vh;padding:.5rem;border:1px solid var(--gold);border-radius:14px;background:#080604}dialog::backdrop{background:#000d;backdrop-filter:blur(4px)}dialog img{display:block;max-width:100%;max-height:88vh;width:auto;height:auto;margin:auto}.close{position:fixed;top:1rem;right:1rem;width:44px;height:44px;padding:0;background:#20150d}
@media(max-width:420px){nav{gap:.3rem}button{padding:.6rem .72rem;font-size:.9rem}}
.ritmo{max-width:720px;margin:2rem auto 0}.ritmo table{width:100%;border-collapse:collapse;border:1px solid #a27634;margin-top:1rem;text-align:left}.ritmo th,.ritmo td{padding:.75rem .55rem;border-bottom:1px solid #6e4b1e}.ritmo th{background:var(--gold);color:var(--ink)}.ritmo td:first-child{white-space:nowrap;color:var(--gold);font-size:.85rem;font-weight:700}.ritmo tr:nth-child(even){background:#24170d}
.program-label{max-width:720px;margin:1.75rem auto .65rem;padding:.65rem 1rem;border-radius:10px;font-size:1.25rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.ritmo-label{background:#f0c86a;color:#100b07}.poster-frame .program-label{margin:.1rem 0 .45rem}
</style>
</head>
<body>
<header><p class="eyebrow">27 · 28 · 29 novembre 2026</p><h1>The Big Latin Event</h1><p>La griglia degli stage, sempre aggiornata al giorno corrente.</p></header>
<nav aria-label="Seleziona la giornata"><button type="button" data-day="0" aria-selected="true">Ven 27</button><button type="button" data-day="1" aria-selected="false">Sab 28</button><button type="button" data-day="2" aria-selected="false">Dom 29</button></nav>
<main><h2 id="day-title">Venerdì 27 novembre</h2><p class="hint">Tocca la locandina per aprirla e ingrandirla.</p><div class="poster-frame"><button id="open-poster" type="button" aria-label="Ingrandisci la locandina"><img id="poster" src="venerdi.jpg" alt="Programma di venerdì 27 novembre"></button></div><div id="ritmo-photo" class="poster-frame" hidden><h3 class="program-label ritmo-label">Sala Ritmo</h3><button type="button" id="open-ritmo" aria-label="Ingrandisci locandina Sala Ritmo"><img id="ritmo-image" alt="Programma Sala Ritmo"></button></div><section id="ritmo" class="ritmo" hidden><h2 class="program-label ritmo-label">Sala Ritmo</h2><table><thead><tr><th>Orario</th><th>Programma</th></tr></thead><tbody id="ritmo-rows"></tbody></table></section></main>
<footer><p class="muted">Le lezioni del programma esposto potrebbero essere soggette a variazioni.</p></footer>
<dialog id="zoom" aria-label="Locandina ingrandita"><button class="close" id="close-zoom" type="button" aria-label="Chiudi">×</button><img id="zoom-image" src="venerdi.jpg" alt=""></dialog>
<script>
const ritmoData=[[],[["14:00 – 14:45","Opening Event – All the Instructors"],["14:50 – 15:35","Ritmo Energy® – Luca Donadio"],["15:40 – 16:25","Salsation® – Nakea"],["16:30 – 17:15","Ritmo Fit Dance® – RFD Team"],["17:20 – 18:05","Ritmo Fit Dance® – Tiago da Silva"],["18:10 – 18:55","Reggaeton Fitness – Anna Jessy"],["19:00 – 19:45","Zumba® Explosion – Multizin"],["19:30 – 21:00","Cena"],["22:15","Inizio show"],["23:30","Inizio serata"]],[["09:45 – 10:30","Zumba® Explosion – Multizin"],["10:35 – 11:20","Ritmo Step® – Giusi Barba"],["11:25 – 12:10","Ritmo Capolelé® – Carmen Ursu"],["12:15 – 13:00","Ritmo Fit Dance® – Tiago da Silva & Team"]]];
function showRitmoPhoto(index){const frame=document.getElementById('ritmo-photo'),img=document.getElementById('ritmo-image'),fallback=document.getElementById('ritmo');frame.hidden=true;img.onload=null;img.onerror=null;if(index===0){img.removeAttribute('src');return;}const file=index===1?'0d60b3f2-0237-4f15-adde-a6b7a846c69a.jpeg':'38b81222-edb5-4fd9-8cfe-6292327134fd.jpeg';img.onload=()=>{frame.hidden=false;fallback.hidden=true;};img.onerror=()=>{frame.hidden=true;fallback.hidden=false;};img.src=file;}
function showRitmo(index){const section=document.getElementById('ritmo'),body=document.getElementById('ritmo-rows');section.hidden=!ritmoData[index].length;body.replaceChildren();for(const row of ritmoData[index]){const tr=body.insertRow();for(const value of row)tr.insertCell().textContent=value;}}
const days=[{title:'Venerdì 27 novembre',file:'venerdi.jpg'},{title:'Sabato 28 novembre',file:'sabato.jpg'},{title:'Domenica 29 novembre',file:'domenica.jpg'}];
const title=document.getElementById('day-title'),poster=document.getElementById('poster'),zoom=document.getElementById('zoom'),zoomImage=document.getElementById('zoom-image');
function italianEventDay(){const day=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',day:'numeric'}).format(new Date());return Math.max(0,Math.min(2,Number(day)-27))}
function show(index){showRitmo(index);showRitmoPhoto(index);const day=days[index];title.textContent=day.title;poster.src=day.file;poster.alt='Programma di '+day.title;zoomImage.src=day.file;zoomImage.alt=poster.alt;document.querySelectorAll('[data-day]').forEach((button,i)=>button.setAttribute('aria-selected',String(i===index)))}
document.querySelectorAll('[data-day]').forEach(button=>button.addEventListener('click',()=>show(Number(button.dataset.day))));
document.getElementById('open-poster').addEventListener('click',()=>{zoomImage.src=poster.src;zoomImage.alt=poster.alt;zoom.showModal()});document.getElementById('open-ritmo').addEventListener('click',()=>{const img=document.getElementById('ritmo-image');zoomImage.src=img.src;zoomImage.alt=img.alt;zoom.showModal()});document.getElementById('close-zoom').addEventListener('click',()=>zoom.close());zoom.addEventListener('click',event=>{if(event.target===zoom)zoom.close()});show(italianEventDay());
</script>
</body>
</html>
